<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.json">
  <title>GBL順位チェッカー</title>
  <script src="pokedex.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background-color: #f0f2f5; color: #333; }
    .container { max-width: 400px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #1976D2; font-size: 24px; margin-top: 0; }
    .image-upload-area { border: 2px dashed #1976D2; border-radius: 8px; padding: 20px; text-align: center; background-color: #E3F2FD; cursor: pointer; margin-bottom: 20px; position: relative; }
    .image-upload-area p { color: #1565C0; font-weight: bold; margin: 0; line-height: 1.5; }
    #scanCanvas { max-width: 100%; border-radius: 4px; display: none; margin-top: 10px; border: 1px solid #ccc; }
    .form-group { margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
    label { font-weight: bold; width: 40%; font-size: 14px; }
    input[type="number"], select { font-size: 16px; padding: 8px; width: 50%; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; text-align: center; }
    button { font-size: 16px; padding: 15px; width: 100%; background-color: #1976D2; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    button:active { background-color: #1565C0; }
    #resultArea { margin-top: 20px; padding: 15px; background-color: #E3F2FD; border-radius: 8px; display: none; }
    .rank-text { font-size: 24px; font-weight: bold; color: #D32F2F; text-align: center; margin: 10px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>GBLチェッカー</h1>
    
    <div class="image-upload-area" onclick="document.getElementById('fileInput').click()">
      <p id="uploadText">📷 タップしてスクショを選択<br><small>（個体値のゲージを自動で読み取ります）</small></p>
      <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="previewImage(event)">
      <canvas id="scanCanvas"></canvas>
    </div>

    <div class="form-group">
      <label>ポケモン選択</label>
      <select id="pokemonSelect" onchange="clearResult()"></select>
    </div>
    
    <div class="form-group">
      <label>攻撃 (ATK)</label>
      <input type="number" id="ivAtk" min="0" max="15" value="0">
    </div>
    <div class="form-group">
      <label>防御 (DEF)</label>
      <input type="number" id="ivDef" min="0" max="15" value="15">
    </div>
    <div class="form-group">
      <label>HP</label>
      <input type="number" id="ivHp" min="0" max="15" value="15">
    </div>
    
    <button onclick="checkRank()">順位を計算する</button>
    
    <div id="resultArea">
      <h3 style="margin-top:0; color:#1565C0; text-align: center;">スーパーリーグ評価</h3>
      <div id="resultText"></div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() { navigator.serviceWorker.register('service-worker.js'); });
    }
    
    window.onload = function() {
      const select = document.getElementById('pokemonSelect');
      for (const pokemonName in POKEDEX) {
        const option = document.createElement('option');
        option.value = pokemonName;
        option.textContent = pokemonName;
        select.appendChild(option);
      }
    };

    function previewImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      const canvas = document.getElementById('scanCanvas');
      const ctx = canvas.getContext('2d');
      const text = document.getElementById('uploadText');
      const reader = new FileReader();

      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          try {
            const targetWidth = 500;
            const scale = targetWidth / img.width;
            canvas.width = targetWidth;
            canvas.height = Math.floor(img.height * scale);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            canvas.style.display = 'block';
            text.style.display = 'none';

            const width = canvas.width;
            const height = canvas.height;
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;

            const startY = Math.floor(height * 0.45);
            const endY = Math.floor(height * 0.95);
            
            // 1. スタンプを確実に避けるため、X=35% から X=85% の範囲で調べる
            const scanStartX = Math.floor(width * 0.35);
            const scanEndX = Math.floor(width * 0.85);

            let rowHits = new Array(height).fill(0);

            for (let y = startY; y < endY; y++) {
              let hits = 0;
              for (let x = scanStartX; x < scanEndX; x++) {
                const i = (y * width + x) * 4;
                const r = data[i], g = data[i+1], b = data[i+2];
                const max = Math.max(r,g,b), min = Math.min(r,g,b);
                
                // 赤・黄・青どのチームの色でも反応する
                const isTeam = (r > 160 && b < 140 && r - b > 30) || (b > 160 && r < 140 && b - r > 30);
                const isGray = (max > 130 && max < 245 && max - min < 25);
                
                if (isTeam || isGray) hits++;
              }
              rowHits[y] = hits;
            }

            // 2. 文字を排除：「横幅の20%以上」長く連続している線だけをゲージと認定する
            let peaks = [];
            let inPeak = false;
            let currentPeakY = 0;
            let currentPeakMaxHits = 0;
            const minBarWidth = width * 0.20; 

            for (let y = startY; y < endY; y++) {
              if (rowHits[y] > minBarWidth) {
                if (!inPeak) {
                  inPeak = true;
                  currentPeakMaxHits = rowHits[y];
                  currentPeakY = y;
                } else if (rowHits[y] > currentPeakMaxHits) {
                  currentPeakMaxHits = rowHits[y];
                  currentPeakY = y;
                }
              } else {
                if (inPeak) { peaks.push(currentPeakY); inPeak = false; }
              }
            }

            if (peaks.length < 3) {
              throw new Error("ゲージが正しく見つかりません。");
            }

            // 3. 一番下のHPゲージを「基準の定規」にする
            const targetPeaks = peaks.slice(-3); // 攻撃、防御、HP
            const hpY = targetPeaks[2]; 

            let firstX = -1, lastX = -1;
            // HPゲージはスタンプと被らないので広く(10%〜90%)調べる
            for (let x = Math.floor(width * 0.1); x < Math.floor(width * 0.9); x++) {
              const i = (hpY * width + x) * 4;
              const r = data[i], g = data[i+1], b = data[i+2];
              const max = Math.max(r,g,b), min = Math.min(r,g,b);
              const isTeam = (r > 160 && b < 140 && r - b > 30) || (b > 160 && r < 140 && b - r > 30);
              const isGray = (max > 130 && max < 245 && max - min < 25);
              
              if (isTeam || isGray) {
                if (firstX === -1) firstX = x;
                lastX = x;
              }
            }

            if (firstX === -1 || lastX === -1) throw new Error("基準ゲージの測定に失敗しました。");

            // 4. 定規(firstX ~ lastX)の上で、どこまで色が付いているか「先端」を探す
            let ivs = [];
            for (let p = 0; p < targetPeaks.length; p++) {
              const y = targetPeaks[p];
              let lastColoredX = -1;

              for (let x = firstX; x <= lastX; x++) {
                const i = (y * width + x) * 4;
                const r = data[i], g = data[i+1], b = data[i+2];
                const isTeam = (r > 160 && b < 140 && r - b > 30) || (b > 160 && r < 140 && b - r > 30);
                
                if (isTeam) {
                  lastColoredX = x;
                }
              }

              let iv = 0;
              if (lastColoredX === -1) {
                iv = 0;
              } else {
                // ピクセル数ではなく、確実な「座標の割合」で算出する
                let ratio = (lastColoredX - firstX) / (lastX - firstX);
                if (ratio > 0.95) iv = 15; // ほぼ満タンなら15
                else iv = Math.round(ratio * 15);
              }
              
              if (iv > 15) iv = 15;
              if (iv < 0) iv = 0;

              ivs.push(iv);

              // 読み取った「先端」まで緑色の線を引く
              ctx.beginPath();
              ctx.moveTo(firstX, y);
              ctx.lineTo(lastColoredX !== -1 ? lastColoredX : firstX, y);
              ctx.strokeStyle = '#00FF00';
              ctx.lineWidth = 4;
              ctx.stroke();
            }

            document.getElementById('ivAtk').value = ivs[0];
            document.getElementById('ivDef').value = ivs[1];
            document.getElementById('ivHp').value = ivs[2];

            setTimeout(() => {
              checkRank();
            }, 100);

          } catch (error) {
            alert("❌ エラーが発生しました:\n" + error.message);
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    const cpmTable = [
      0.094, 0.135137432, 0.16639787, 0.192650919, 0.215732473, 0.236572661, 0.25572005, 0.273530381, 0.29024988, 
      0.306057377, 0.3210876, 0.335445036, 0.34921268, 0.362457751, 0.37523559, 0.387592406, 0.39956728, 0.411193551, 
      0.42250001, 0.432926419, 0.44310755, 0.453059958, 0.46279839, 0.472336083, 0.48168495, 0.4908558, 0.49985844, 
      0.508701765, 0.51739395, 0.525942511, 0.53435433, 0.542635767, 0.55079269, 0.558830576, 0.56675452, 0.574569153, 
      0.58227891, 0.589887907, 0.59740001, 0.604818814, 0.61215729, 0.619399365, 0.62656713, 0.633644533, 0.64065295, 
      0.647576426, 0.65443206, 0.661214806, 0.667934, 0.674577537, 0.68116492, 0.687680648, 0.69414365, 0.70054287, 
      0.70688421, 0.713164996, 0.71939909, 0.725571552, 0.7317, 0.734741009, 0.73776948, 0.740785574, 0.74378943, 
      0.746781211, 0.74976104, 0.752729087, 0.75568551, 0.758630378, 0.76156384, 0.764486065, 0.76739717, 0.770297266, 
      0.7731865, 0.776064962, 0.77893275, 0.781790055, 0.78463697, 0.787473578, 0.79030001, 0.79280396, 0.79530001, 
      0.79780396, 0.80030001, 0.80280396, 0.80530001, 0.80780396, 0.81030001, 0.81280396, 0.81530001, 0.81780396, 
      0.82030001, 0.82280396, 0.82530001, 0.82780396, 0.83030001, 0.83280396, 0.83530001, 0.83780396, 0.84030001, 
      0.84280396, 0.84530001
    ];

    let currentRankingCache = { pokemon: "", ranks: [] };

    function calculateGBLStats(baseAtk, baseDef, baseHp, ivA, ivD, ivH, targetCP = 1500) {
      let bestStat = null;
      
      for (let i = 0; i < cpmTable.length; i++) {
        const cpm = cpmTable[i];
        const level = 1.0 + (i * 0.5);
        const atk = baseAtk + ivA;
        const def = baseDef + ivD;
        const hp = baseHp + ivH;
        
        const cp = Math.max(10, Math.floor((atk * Math.sqrt(def) * Math.sqrt(hp) * Math.pow(cpm, 2)) / 10));
        
        if (cp <= targetCP) {
          const realAtk = atk * cpm;
          const realDef = def * cpm;
          const realHp = Math.floor(hp * cpm);
          bestStat = { level, cp, statProduct: realAtk * realDef * realHp, ivA, ivD, ivH };
        } else {
          break;
        }
      }
      return bestStat;
    }

    function getRanking(pokemonName) {
      if (currentRankingCache.pokemon === pokemonName) return currentRankingCache.ranks;
      const baseStats = POKEDEX[pokemonName];
      const ranks = [];
      for (let a = 0; a <= 15; a++) {
        for (let d = 0; d <= 15; d++) {
          for (let h = 0; h <= 15; h++) {
            const stat = calculateGBLStats(baseStats.atk, baseStats.def, baseStats.hp, a, d, h, 1500);
            if (stat) ranks.push(stat);
          }
        }
      }
      ranks.sort((a, b) => b.statProduct - a.statProduct);
      currentRankingCache = { pokemon: pokemonName, ranks: ranks };
      return ranks;
    }

    function clearResult() { document.getElementById('resultArea').style.display = 'none'; }

    function checkRank() {
      const selectedPokemon = document.getElementById('pokemonSelect').value;
      const a = parseInt(document.getElementById('ivAtk').value);
      const d = parseInt(document.getElementById('ivDef').value);
      const h = parseInt(document.getElementById('ivHp').value);
      const ranks = getRanking(selectedPokemon);
      let myRank = -1;
      let myStat = null;
      for (let i = 0; i < ranks.length; i++) {
        if (ranks[i].ivA === a && ranks[i].ivD === d && ranks[i].ivH === h) {
          myRank = i + 1; myStat = ranks[i]; break;
        }
      }

      const resultArea = document.getElementById('resultArea');
      const resultText = document.getElementById('resultText');
      resultArea.style.display = 'block';
      if (myStat) {
        const percentile = ((myRank / 4096) * 100).toFixed(1);
        resultText.innerHTML = `
          <div style="text-align:center; font-weight:bold; color:#555;">${selectedPokemon}</div>
          <div class="rank-text">${myRank} 位 <span style="font-size:16px; color:#666;">/ 4096</span></div>
          <p style="text-align:center; margin-top:0;">(上位 ${percentile} %)</p>
          <hr style="border:0; border-top:1px dashed #ccc;">
          <ul style="line-height:1.8; color:#444;">
            <li>到達CP: <b>${myStat.cp}</b> (Lv ${myStat.level})</li>
            <li>ステータス積: <b>${Math.round(myStat.statProduct).toLocaleString()}</b></li>
          </ul>
        `;
      }
    }
  </script>
</body>
</html>
